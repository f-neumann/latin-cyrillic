<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latin → Cyrillic</title>
<style>
  :root {
    --bg: #f6f5f2;
    --ink: #1c1b19;
    --muted: #7a766e;
    --accent: #b23b3b;
    --card: #ffffff;
    --border: #e3e0d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1918;
      --ink: #f2efe9;
      --muted: #9a958a;
      --accent: #e0685f;
      --card: #242220;
      --border: #38352f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1.25rem 4rem;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 .25rem;
    letter-spacing: -0.01em;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 2rem;
    font-size: .95rem;
    text-align: center;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  label {
    display: block;
    font-size: .8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: .5rem;
  }
  input#latin {
    width: 100%;
    font-size: 1.6rem;
    padding: .75rem .9rem;
    border-radius: .6rem;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    outline: none;
    font-family: inherit;
  }
  input#latin:focus {
    border-color: var(--accent);
  }
  .keyboard {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    margin-top: .6rem;
  }
  .key {
    font-family: inherit;
    font-size: 1.1rem;
    padding: .45rem .7rem;
    border-radius: .45rem;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    line-height: 1;
  }
  .key:hover {
    border-color: var(--accent);
  }
  .key:active {
    transform: translateY(1px);
  }
  .key.shift {
    color: var(--muted);
    font-size: .95rem;
  }
  .key.shift.active {
    background: var(--accent);
    color: var(--card);
    border-color: var(--accent);
  }
  .output-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: .6rem;
    padding: .9rem;
    min-height: 3.4rem;
  }
  #cyrillic {
    font-size: 2rem;
    word-break: break-word;
    min-height: 2.4rem;
  }
  #cyrillic:empty::before {
    content: "…";
    color: var(--border);
  }
  .tiles {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: .5rem;
    padding: .4rem .55rem;
    min-width: 2.4rem;
  }
  .tile .lat {
    font-size: .8rem;
    color: var(--muted);
  }
  .tile .cyr {
    font-size: 1.3rem;
    color: var(--accent);
    font-weight: 600;
  }
  footer {
    margin-top: 3rem;
    font-size: .78rem;
    color: var(--muted);
    text-align: center;
    max-width: 560px;
  }
  footer code {
    background: var(--card);
    border: 1px solid var(--border);
    padding: .05rem .3rem;
    border-radius: .3rem;
  }
  details.alphabet {
    width: 100%;
  }
  details.alphabet summary {
    cursor: pointer;
    font-size: .85rem;
    font-weight: 600;
    color: var(--accent);
    padding: .5rem 0;
    list-style: none;
    display: flex;
    align-items: center;
    gap: .35rem;
  }
  details.alphabet summary::-webkit-details-marker {
    display: none;
  }
  details.alphabet summary::before {
    content: "▸";
    display: inline-block;
    transition: transform .15s ease;
  }
  details.alphabet[open] summary::before {
    transform: rotate(90deg);
  }
  .abc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr));
    gap: .5rem;
    margin-top: .5rem;
  }
  .abc-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: .5rem;
    padding: .5rem .3rem;
    text-align: center;
  }
  .abc-card .abc-lat {
    font-size: .85rem;
    color: var(--muted);
  }
  .abc-card .abc-cyr {
    font-size: 1.15rem;
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
  <h1>Latin → Ćirilica</h1>
  <p class="sub">Type a Serbian word in Latin script — watch it become Cyrillic, letter by letter.</p>

  <div class="wrap">
    <div>
      <label for="latin">Latin</label>
      <input id="latin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Vesna" autofocus>
      <div class="keyboard" id="keyboard">
        <button type="button" class="key shift" id="shiftKey" aria-pressed="false" title="Capitalize next letter">⇧ Shift</button>
        <button type="button" class="key" data-letter="č">č</button>
        <button type="button" class="key" data-letter="ć">ć</button>
        <button type="button" class="key" data-letter="đ">đ</button>
        <button type="button" class="key" data-letter="š">š</button>
        <button type="button" class="key" data-letter="ž">ž</button>
      </div>
    </div>

    <div>
      <label>Cyrillic</label>
      <div class="output-card">
        <div id="cyrillic"></div>
      </div>
    </div>

    <div>
      <label>Letter by letter</label>
      <div class="tiles" id="tiles"></div>
    </div>

    <details class="alphabet" id="alphabet">
      <summary>Show the alphabet</summary>
      <div class="abc-grid" id="abcGrid"></div>
    </details>
  </div>

  <footer>
    Digraphs <code>nj</code>, <code>lj</code>, <code>dž</code> are recognized as single Cyrillic letters (њ, љ, џ). Use <code>č ć đ š ž</code> for the accented letters.
    ·
    <a href="#alphabet">Link to alphabet</a>
  </footer>

<script>
  const DIGRAPHS = {
    'nj': 'њ', 'Nj': 'Њ', 'NJ': 'Њ',
    'lj': 'љ', 'Lj': 'Љ', 'LJ': 'Љ',
    'dž': 'џ', 'Dž': 'Џ', 'DŽ': 'Џ'
  };

  const SINGLES = {
    a:'а', b:'б', c:'ц', č:'ч', ć:'ћ', d:'д', đ:'ђ', e:'е', f:'ф',
    g:'г', h:'х', i:'и', j:'ј', k:'к', l:'л', m:'м', n:'н', o:'о',
    p:'п', r:'р', s:'с', š:'ш', t:'т', u:'у', v:'в', z:'з', ž:'ж',
    A:'А', B:'Б', C:'Ц', Č:'Ч', Ć:'Ћ', D:'Д', Đ:'Ђ', E:'Е', F:'Ф',
    G:'Г', H:'Х', I:'И', J:'Ј', K:'К', L:'Л', M:'М', N:'Н', O:'О',
    P:'П', R:'Р', S:'С', Š:'Ш', T:'Т', U:'У', V:'В', Z:'З', Ž:'Ж'
  };

  // Splits input into graphemes (digraphs kept together) paired with their Cyrillic equivalent.
  function graphemes(text) {
    const out = [];
    let i = 0;
    while (i < text.length) {
      const two = text.substr(i, 2);
      if (DIGRAPHS[two]) {
        out.push({ lat: two, cyr: DIGRAPHS[two] });
        i += 2;
        continue;
      }
      const ch = text[i];
      out.push({ lat: ch, cyr: SINGLES[ch] !== undefined ? SINGLES[ch] : ch });
      i += 1;
    }
    return out;
  }

  const input = document.getElementById('latin');
  const cyrillicEl = document.getElementById('cyrillic');
  const tilesEl = document.getElementById('tiles');

  function render() {
    const parts = graphemes(input.value);
    cyrillicEl.textContent = parts.map(p => p.cyr).join('');
    tilesEl.innerHTML = '';
    for (const p of parts) {
      if (p.lat.trim() === '') continue;
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `<span class="lat">${p.lat}</span><span class="cyr">${p.cyr}</span>`;
      tilesEl.appendChild(tile);
    }
  }

  input.addEventListener('input', render);
  render();

  // On-screen keyboard for the accented letters a US keyboard can't type
  // directly (č ć đ š ž — dž is then just d + ž). Shift is momentary,
  // like a mobile keyboard: it capitalizes the next key press and resets.
  const shiftKey = document.getElementById('shiftKey');
  let shiftActive = false;

  function setShift(active) {
    shiftActive = active;
    shiftKey.classList.toggle('active', active);
    shiftKey.setAttribute('aria-pressed', String(active));
  }

  shiftKey.addEventListener('click', () => setShift(!shiftActive));

  function insertAtCursor(el, text) {
    const start = el.selectionStart ?? el.value.length;
    const end = el.selectionEnd ?? el.value.length;
    el.value = el.value.slice(0, start) + text + el.value.slice(end);
    const pos = start + text.length;
    el.selectionStart = el.selectionEnd = pos;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.focus();
  }

  for (const key of document.querySelectorAll('.key[data-letter]')) {
    key.addEventListener('click', () => {
      const letter = key.dataset.letter;
      insertAtCursor(input, shiftActive ? letter.toUpperCase() : letter);
      if (shiftActive) setShift(false);
    });
  }

  // Official Serbian Latin alphabet order (30 letters, digraphs kept together).
  const ALPHABET = [
    ['A','a'], ['B','b'], ['C','c'], ['Č','č'], ['Ć','ć'], ['D','d'], ['Dž','dž'],
    ['Đ','đ'], ['E','e'], ['F','f'], ['G','g'], ['H','h'], ['I','i'], ['J','j'],
    ['K','k'], ['L','l'], ['Lj','lj'], ['M','m'], ['N','n'], ['Nj','nj'], ['O','o'],
    ['P','p'], ['R','r'], ['S','s'], ['Š','š'], ['T','t'], ['U','u'], ['V','v'],
    ['Z','z'], ['Ž','ž']
  ];

  const abcGrid = document.getElementById('abcGrid');
  for (const [upper, lower] of ALPHABET) {
    const cyrUpper = graphemes(upper).map(p => p.cyr).join('');
    const cyrLower = graphemes(lower).map(p => p.cyr).join('');
    const card = document.createElement('div');
    card.className = 'abc-card';
    card.innerHTML = `<div class="abc-lat">${upper} ${lower}</div><div class="abc-cyr">${cyrUpper} ${cyrLower}</div>`;
    abcGrid.appendChild(card);
  }

  // Support linking directly to an open alphabet section, e.g. #alphabet
  const alphabetDetails = document.getElementById('alphabet');
  function syncAlphabetFromHash() {
    if (location.hash === '#alphabet') {
      alphabetDetails.open = true;
      alphabetDetails.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
  window.addEventListener('hashchange', syncAlphabetFromHash);
  syncAlphabetFromHash();
</script>
</body>
</html>
